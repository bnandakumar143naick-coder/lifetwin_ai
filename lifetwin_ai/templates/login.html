{% extends "base.html" %}
{% block title %}Login — LifeTwin AI{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:0 auto;">
  <h2>Welcome back</h2>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit">Login</button>
  </form>
  <p style="margin-top:14px;">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  <p class="muted small" style="margin-top:8px;">Doctor? <a href="{{ url_for('eco_auth.doctor_login') }}">Doctor portal</a> ·
     Family member? <a href="{{ url_for('eco_auth.family_login') }}">Family login</a></p>
</div>
{% endblock %}
