{% extends "base.html" %}
{% block title %}Health Data Entry — LifeTwin AI{% endblock %}
{% block content %}
<h1>Health Data Entry</h1>
<p>Enter your vital signs manually. Don't know a value? Just skip it — you can update it anytime.</p>

<div class="card" style="max-width:600px;">
  <form method="POST">
    <div class="grid grid-2">
      <div>
        <label>Systolic Blood Pressure (mmHg)</label>
        <input type="number" name="systolic_bp" placeholder="e.g. 120">
      </div>
      <div>
        <label>Diastolic Blood Pressure (mmHg)</label>
        <input type="number" name="diastolic_bp" placeholder="e.g. 80">
      </div>
    </div>
    <label>Blood Sugar (mg/dL)</label>
    <input type="number" step="0.1" name="blood_sugar" placeholder="e.g. 95">
    <label>Heart Rate (bpm)</label>
    <input type="number" name="heart_rate" placeholder="e.g. 72">
    <label>Oxygen Saturation (%)</label>
    <input type="number" name="oxygen_saturation" placeholder="e.g. 98">
    <label>Body Temperature (°C)</label>
    <input type="number" step="0.1" name="body_temperature" placeholder="e.g. 36.8">
    <label>Cholesterol (mg/dL) — optional</label>
    <input type="number" step="0.1" name="cholesterol" placeholder="e.g. 180">

    <button class="btn" type="submit">Save Health Data</button>
  </form>
</div>
{% endblock %}
