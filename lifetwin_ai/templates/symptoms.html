{% extends "base.html" %}
{% block title %}Symptoms — LifeTwin AI{% endblock %}
{% block content %}
<h1>Current Symptoms</h1>
<p>Select any symptoms you currently have. The AI will analyze them alongside your health profile.</p>

<div class="card">
  <form method="POST">
    <div class="symptom-grid">
      {% for s in all_symptoms %}
      <label class="symptom-chip">
        <input type="checkbox" name="symptoms" value="{{ s }}"> {{ s }}
      </label>
      {% endfor %}
    </div>
    <button class="btn" type="submit">Analyze Symptoms</button>
  </form>
</div>
{% endblock %}
