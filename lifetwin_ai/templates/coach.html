{% extends "base.html" %}
{% block title %}AI Health Coach — LifeTwin AI{% endblock %}
{% block content %}
<h1>💬 AI Health Coach</h1>
<p>Ask anything about your health — answers are based on your own profile and latest data.</p>

<div class="card coach-box">
  <div class="suggested-qs">
    <button type="button" onclick="ask('Why is my blood pressure high?')">Why is my blood pressure high?</button>
    <button type="button" onclick="ask('What should I eat today?')">What should I eat today?</button>
    <button type="button" onclick="ask('How can I reduce my cholesterol?')">Reduce my cholesterol?</button>
    <button type="button" onclick="ask('Why is my health score decreasing?')">Why is my health score low?</button>
    <button type="button" onclick="ask('What exercises are best for me?')">Best exercises for me?</button>
  </div>

  <div id="chatWindow">
    {% if question %}
    <div class="chat-bubble chat-question">{{ question }}</div>
    <div class="chat-bubble chat-answer">{{ answer }}</div>
    {% endif %}
  </div>

  <form id="coachForm" onsubmit="return submitQuestion(event)">
    <input type="text" id="questionInput" placeholder="Ask your health question..." required>
    <button class="btn" type="submit">Ask</button>
  </form>
</div>

<script>
function ask(q) {
  document.getElementById('questionInput').value = q;
  submitQuestion(new Event('submit'));
}

async function submitQuestion(e) {
  e.preventDefault();
  const input = document.getElementById('questionInput');
  const q = input.value.trim();
  if (!q) return false;

  const win = document.getElementById('chatWindow');
  const qDiv = document.createElement('div');
  qDiv.className = 'chat-bubble chat-question';
  qDiv.textContent = q;
  win.appendChild(qDiv);

  const res = await fetch("{{ url_for('coach_ask') }}", {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question: q})
  });
  const data = await res.json();

  const aDiv = document.createElement('div');
  aDiv.className = 'chat-bubble chat-answer';
  aDiv.textContent = data.answer;
  win.appendChild(aDiv);

  input.value = '';
  return false;
}
</script>
{% endblock %}
